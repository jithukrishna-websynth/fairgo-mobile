name: Auto PR to dev

on:
  push:
    branches: ['feature/**', 'fix/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR into dev if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --base dev --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "$BRANCH" \
              --body "Auto-created PR from \`$BRANCH\` into \`dev\`."
          fi
